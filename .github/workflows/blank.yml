name: Build all A12-A13 ramdisks

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload encrypted ZIPs to GitHub Actions storage
        required: true
        type: boolean
        default: false
      target_slug:
        description: Optional target slug from ci/targets.tsv; blank builds all
        required: false
        type: string
        default: ''
      major:
        description: OS major filter (e.g., 13,14,15,16,17,18,26) – blank builds all (may exceed 256 limit)
        required: false
        type: string
        default: '18'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          # Full mapping from version -> build
          BUILD_TO_VERSION='{"13.4":"17E255","14.1":"18A8395","15.0":"19A346","16.0":"20A362","16.1":"20B82","16.2":"20C65","16.4":"20E247","17.0":"21A329","17.1":"21B74","17.2":"21C62","17.3":"21D50","17.4":"21E219","17.5":"21F79","17.6":"21G80","18.0":"22A3354","18.1":"22B83","18.2":"22C152","18.3":"22D63","18.4":"22E240","18.5":"22F76","18.6":"22G86","18.7":"22H100","26.1":"23B74","26.2":"23C75","26.3":"23D127","26.4":"23E238"}'

          TARGETS_JSON='{"include": []}'
          if [ -f "ci/targets.tsv" ]; then
            TARGETS_JSON="$(python3 - <<'EOF'
          import sys, json, csv, os

          tsv_path = 'ci/targets.tsv'
          target_slug = os.environ.get('INPUT_TARGET_SLUG', '').strip()
          major_filter = os.environ.get('INPUT_MAJOR', '').strip()
          build_to_version = json.loads(os.environ.get('BUILD_TO_VERSION', '{}'))

          devices = []
          try:
              with open(tsv_path) as f:
                  reader = csv.DictReader(f, delimiter='\t')
                  for row in reader:
                      if not any(row.values()):
                          continue
                      if target_slug and row.get('slug') != target_slug:
                          continue
                      devices.append(row)
          except Exception:
              print(json.dumps({"include": []}))
              sys.exit(0)

          rows = []
          for dev in devices:
              for version, build in build_to_version.items():
                  if major_filter and not version.startswith(major_filter + '.'):
                      continue
                  new_row = {k: str(v) for k, v in dev.items()}
                  new_row['build'] = build
                  new_row['version'] = version
                  rows.append(new_row)

          print(json.dumps({"include": rows}))
          EOF
          )" || TARGETS_JSON='{"include": []}'
          fi

          echo "targets=$TARGETS_JSON" >> "$GITHUB_OUTPUT"
          echo "Generated matrix: $TARGETS_JSON" >&2
        env:
          INPUT_TARGET_SLUG: ${{ inputs.target_slug }}
          INPUT_MAJOR: ${{ inputs.major }}
          BUILD_TO_VERSION: '{"13.4":"17E255","14.1":"18A8395","15.0":"19A346","16.0":"20A362","16.1":"20B82","16.2":"20C65","16.4":"20E247","17.0":"21A329","17.1":"21B74","17.2":"21C62","17.3":"21D50","17.4":"21E219","17.5":"21F79","17.6":"21G80","18.0":"22A3354","18.1":"22B83","18.2":"22C152","18.3":"22D63","18.4":"22E240","18.5":"22F76","18.6":"22G86","18.7":"22H100","26.1":"23B74","26.2":"23C75","26.3":"23D127","26.4":"23E238"}'

  build:
    needs: matrix
    runs-on: macos-15-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    env:
      RAMDISK_ZIP_PASSWORD: ${{ secrets.RAMDISK_ZIP_PASSWORD }}
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x *.sh
          chmod -R +x tools/

      - name: Verify archive password secret
        run: test -n "$RAMDISK_ZIP_PASSWORD"

      - name: Install build dependencies
        run: |
          if ! command -v ipsw >/dev/null; then
            release_json="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_API_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              https://api.github.com/repos/blacktop/ipsw/releases/latest)"
            tag="$(jq -r '.tag_name' <<<"$release_json")"
            version="${tag#v}"
            archive="ipsw_${version}_macOS_universal.tar.gz"
            url="https://github.com/blacktop/ipsw/releases/download/${tag}/${archive}"
            temp_dir="$(mktemp -d)"
            curl --fail --location --show-error "$url" -o "$temp_dir/$archive"
            tar -xzf "$temp_dir/$archive" -C "$temp_dir"
            binary="$(find "$temp_dir" -type f -name ipsw -print -quit)"
            test -n "$binary"
            chmod +x "$binary"
            sudo cp "$binary" /usr/local/bin/ipsw
            rm -rf "$temp_dir"
          fi
          ./setup.sh
          command -v 7z >/dev/null || brew install sevenzip || true

      - name: Build offline ramdisk
        run: |
          printf "%s\ny\n" "${{ matrix.build }}" | ./build.sh \
            --product '${{ matrix.product }}' \
            --model '${{ matrix.board }}' \
            --cpid '${{ matrix.cpid }}' \
            --name '${{ matrix.name }}' \
            --with-fw

      - name: Create password-protected ZIP
        run: ./protect_bootchain.sh --password-env RAMDISK_ZIP_PASSWORD

      - name: Rename ZIP to product-version format
        id: rename
        run: |
          ORIGINAL_ZIP=$(find protected -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ORIGINAL_ZIP" ]; then
            echo "No ZIP file found in protected/"
            exit 1
          fi
          NEW_NAME="${{ matrix.product }}-${{ matrix.version }}.zip"
          mv "$ORIGINAL_ZIP" "protected/$NEW_NAME"
          echo "path=protected/$NEW_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload_artifacts }}
        with:
          name: ${{ matrix.product }}-${{ matrix.version }}
          path: ${{ steps.rename.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload ZIP to FTP
        run: |
          FILE="${{ steps.rename.outputs.path }}"
          if [ -z "$FILE" ]; then
            echo "No ZIP file found to upload"
            exit 1
          fi
          for i in 1 2 3; do
            if curl --fail --show-error --ftp-create-dirs \
              --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
              -T "$FILE" \
              "ftp://${{ secrets.FTP_HOST }}/"; then
              echo "Upload complete for $FILE"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1
