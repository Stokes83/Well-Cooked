name: Build all A12-A13 ramdisks

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload encrypted ZIPs to GitHub Actions storage
        required: true
        type: boolean
        default: false
      target_slug:
        description: Optional target slug from ci/targets.tsv; blank builds all
        required: false
        type: string
        default: ''
      major:
        description: Optional OS major filter (18 or 26); blank builds both
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          targets="$(python3 scripts/resolve_matrix.py ci/targets.tsv '${{ inputs.target_slug }}' '${{ inputs.major }}')"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: macos-15-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    env:
      RAMDISK_ZIP_PASSWORD: ${{ secrets.RAMDISK_ZIP_PASSWORD }}
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive password secret
        shell: bash
        run: test -n "$RAMDISK_ZIP_PASSWORD"
      - name: Install build dependencies
        shell: bash
        run: |
          if ! command -v ipsw >/dev/null; then
            release_json="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_API_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              https://api.github.com/repos/blacktop/ipsw/releases/latest)"
            tag="$(jq -r '.tag_name' <<<"$release_json")"
            version="${tag#v}"
            archive="ipsw_${version}_macOS_universal.tar.gz"
            url="https://github.com/blacktop/ipsw/releases/download/${tag}/${archive}"
            temp_dir="$(mktemp -d)"
            curl --fail --location --show-error "$url" -o "$temp_dir/$archive"
            tar -xzf "$temp_dir/$archive" -C "$temp_dir"
            binary="$(find "$temp_dir" -type f -name ipsw -print -quit)"
            test -n "$binary"
            chmod +x "$binary"
            sudo cp "$binary" /usr/local/bin/ipsw
            rm -rf "$temp_dir"
          fi
          ./setup.sh
          command -v 7z >/dev/null || brew install sevenzip
      - name: Build offline ramdisk
        shell: bash
        run: |
          ./build.sh \
            --product '${{ matrix.product }}' \
            --model '${{ matrix.board }}' \
            --cpid '${{ matrix.cpid }}' \
            --name '${{ matrix.name }}' \
            --build '${{ matrix.build }}' \
            --with-fw
      - name: Create password-protected ZIP
        shell: bash
        run: ./protect_bootchain.sh --password-env RAMDISK_ZIP_PASSWORD
      - name: Select archive
        id: archive
        shell: bash
        run: echo "path=$(find protected -maxdepth 1 -type f -name '*.zip' -print -quit)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload_artifacts }}
        with:
          name: ${{ matrix.slug }}-ios-${{ matrix.version }}-${{ matrix.build }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          retention-days: 7
